# OpenOCD config: cheap Chinese ST-Link/V2 clone (USB 0483:3748) + nRF52840
# (ProMicro nRF52840 board). Used by the "flash" task and by the
# Cortex-Debug launch configs in .vscode/launch.json.
#
# Wiring (4 wires; power the board from its own USB):
#
#   ST-Link       nRF52840
#   -----         --------
#   SWDIO   -->   SWDIO
#   SWCLK   -->   SWCLK
#   GND     -->   GND
#   3.3V    -->   VDD  (ONLY if the board is NOT powered on its own;
#                      with two supplies you get a power conflict)
#
# Notes:
#  * The clone has no SRST line. Reset is emulated over SWD via
#    AIRCR.SYSRESETREQ (enabled by target/nordic/nrf52.cfg for this driver).
#  * We use the modern "st-link" (dapdirect) driver from interface/stlink.cfg.
#    It works with clone firmware >= V2J24 (verified with V2J37S7) and, unlike
#    the old HLA driver, keeps CTRL-AP access, so `nrf52_recover` (APPROTECT
#    unlock / mass erase) is available.
#    If your particular clone misbehaves with it, fall back to:
#        source [find interface/stlink-hla.cfg]
#    (with HLA, `nrf52_recover` will NOT work).

source [find interface/stlink.cfg]

# The st-link driver supports swd/jtag/swim; select swd explicitly to avoid
# the "auto-selecting transport" deprecation warning.
transport select swd

source [find target/nordic/nrf52.cfg]

# SWD clock in kHz. 1000 is a sane default for short jumper wires;
# lower it (e.g. "adapter speed 400") if the connection is flaky.
adapter speed 1000
