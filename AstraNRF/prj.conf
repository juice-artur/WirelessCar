CONFIG_SERIAL=y
CONFIG_UART_ASYNC_API=y

# The board default (Kconfig.defconfig) links the application at 0x1000 because
# it assumes the Nordic MBR is factory-programmed at 0x0 and jumps to the app.
# This chip has no MBR (the previously flashed firmware overwrote it and there
# is no mbr.hex in the SDK to restore), so the CPU kept booting from the stale
# vector table at 0x0 -> HardFault/lockup and no breakpoint could ever hit.
# Link the image at 0x0 instead so it boots directly.
CONFIG_FLASH_LOAD_OFFSET=0