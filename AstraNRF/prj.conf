CONFIG_SERIAL=y

# The bridge uses the asynchronous UART API: RX is one long EasyDMA transfer
# over two alternating 512-byte buffers, TX is queued with uart_tx().  The
# interrupt-driven API reads a single byte per ENDRX event and leaves the
# UARTE receiver stopped until the CPU re-arms it; at 115200 with BLE active
# that re-arm is late often enough to swallow the rest of a frame (the
# "only A5 82 09 arrives" symptom), and an overrun there stops RX for good.
CONFIG_UART_ASYNC_API=y

# The console is placed on uart0 by the board DTS, i.e. on the exact pins that
# go to the STM32.  Any printk would be injected into the OTA byte stream, so
# keep it off; there is nothing to log on a production bridge anyway.
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n

# The board default (Kconfig.defconfig) links the application at 0x1000 because
# it assumes the Nordic MBR is factory-programmed at 0x0 and jumps to the app.
# This chip has no MBR (the previously flashed firmware overwrote it and there
# is no mbr.hex in the SDK to restore), so the CPU kept booting from the stale
# vector table at 0x0 -> HardFault/lockup and no breakpoint could ever hit.
# Link the image at 0x0 instead so it boots directly.
CONFIG_FLASH_LOAD_OFFSET=0x0

CONFIG_POSIX_API=y

# BLE peripheral that bridges the NUS-like service to the STM32 UART.
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="AstraCar"
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_ATT_PREPARE_COUNT=1
CONFIG_BT_AUTO_DATA_LEN_UPDATE=y
